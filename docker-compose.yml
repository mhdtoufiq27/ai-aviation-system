services:
  # ==========================================
  # Database: MongoDB
  # ==========================================
  mongo:
    image: mongo:7.0
    container_name: skyflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - skyflow-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # AI Microservice: Python Flask Machine Learning
  # ==========================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: skyflow-ai-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - PYTHONUNBUFFERED=1
    networks:
      - skyflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # Backend API: Node.js / Express / Socket.io
  # ==========================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skyflow-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/aviation_management
      - AI_SERVICE_URL=http://ai-service:5001
      - CLIENT_URL=http://localhost:3000
      - JWT_SECRET=supersecret_aviation_jwt_key_2026_skyflow
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - skyflow-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================
  # Frontend: React + Vite + Tailwind (Nginx)
  # ==========================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
        - VITE_SOCKET_URL=http://localhost:5000
    container_name: skyflow-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - skyflow-network

volumes:
  mongo_data:
    driver: local

networks:
  skyflow-network:
    driver: bridge
